<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ParcelRoute{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shape shape-1"></div><div class="bg-shape shape-2"></div><div class="bg-shape shape-3"></div>
    <header class="topbar glass">
        <div class="wrap bar">
            <a class="brand" href="{{ url_for('main.home') }}">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
                ParcelRoute
            </a>
            <nav><a href="{{ url_for('main.home') }}">Home</a><a href="{{ url_for('main.track') }}">Track a parcel</a></nav>
        </div>
    </header>
    <main class="wrap">{% block content %}{% endblock %}</main>
    <footer class="wrap foot">ParcelRoute · Logistics &amp; Last-Mile Parcel Routing database project</footer>
</body>
</html>
